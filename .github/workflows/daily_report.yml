name: Weekly Stock Briefing

on:
  schedule:
    - cron: '0 1 * * 6'  # UTC 01:00 = KST 10:00, 토요일
  workflow_dispatch:         # 수동 실행 가능

permissions:
  contents: write        # 선정 이력(data/selections.jsonl)을 레포에 다시 커밋

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      # Actions 러너는 실행마다 폐기되므로, 선정 이력을 레포에 커밋해 누적한다.
      # 이 파일이 쌓여야 나중에 사후 수익률을 붙여 가중치를 검증할 수 있다.
      - name: Persist selection log
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "선정 이력 변화 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Chore: 주간 선정 이력 기록 [skip ci]"
          git push
